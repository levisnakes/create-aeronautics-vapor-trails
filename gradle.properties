# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (nicer parameter names)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# Compile against the OLDEST NeoForge we support, so the compiler refuses any
# API that newer builds added. Verified: the whole mod builds against 21.1.1,
# the first NeoForge for 1.21.1. Override for day-to-day dev if you want a
# newer client (./gradlew runClient -Pneo_version=21.1.240) - just never raise
# this permanently without raising neo_version_range too.
neo_version=21.1.1

# What the mod actually DEMANDS of users. Keep this at the floor: packs and
# servers pin all sorts of 21.1.x builds, and anything stricter locks them out
# for no reason.
neo_version_range=[21.1.1,)
loader_version_range=[1,)

## Mod Properties
mod_id=vaportrails
mod_name=Create Aeronautics: Vapor Trails
mod_license=MIT
mod_version=2.4.0
mod_group_id=dev.levi.vaportrails
